<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoGuard Relay Controller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <h1>NeoGuard Relay Controller</h1>
    <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" autofocus>
    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" type="submit">Log in</button>
    <p class="status-msg error" id="login-error" hidden></p>
  </form>
</div>
<script src="login.js"></script>
</body>
</html>
